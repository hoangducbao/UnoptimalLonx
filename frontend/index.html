<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing101 by MiLF</title>
<link rel="stylesheet" href="/app/css/style.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <h2>Search</h2>

    <div class="signal-row" id="signal-row">
      <button class="signal-btn" data-signal="Keyframe" title="Keyframe">🖼️</button>
      <button class="signal-btn" data-signal="ASR" title="ASR">🎙️</button>
      <button class="signal-btn" data-signal="Caption" title="Caption">💬</button>
      <button class="signal-btn" data-signal="OCR" title="OCR">📷</button>
      <button class="signal-btn" data-signal="Summary" title="Summary">✏️</button>
    </div>
    <div class="signal-row">
      <button class="signal-btn" data-signal="Mixed" title="Mixed">🔀</button>
      <button class="signal-btn" data-signal="TRAKE" title="TRAKE">🧭</button>
      <button class="signal-btn" data-signal="Hierarchy" title="Hierarchy">🌳</button>
      <!-- Not a signal (no data-signal, so app.js's signal wiring skips it):
           styled as one purely so it sits in the same icon row. -->
      <button class="signal-btn" id="settings-btn" title="Settings">⚙️</button>
    </div>

    <div id="standard-query-section">
      <label for="query-text">Query</label>
      <textarea id="query-text" placeholder="e.g. một người đàn ông đang lái xe máy (or paste an image)"></textarea>

      <div class="image-query-preview" id="image-query-preview" style="display:none;">
        <img id="image-query-thumb" alt="pasted query image">
        <button class="btn" id="clear-image-query">Clear</button>
      </div>
    </div>

    <div id="trake-query-section" style="display:none;"></div>

    <div id="mixed-query-section" style="display:none;"></div>

    <div class="scope-row">
      <div>
        <label for="video-filter">Search in video</label>
        <input type="text" id="video-filter" placeholder="e.g. L21_V001">
      </div>
      <div>
        <label for="lot-filter">Search in collection</label>
        <input type="text" id="lot-filter" placeholder="e.g. L21-L30">
      </div>
    </div>

    <div class="segmented" id="scope-segmented">
      <button type="button" data-scope="video" title="Restrict to the video id above">vid</button>
      <button type="button" data-scope="collection" title="Restrict to the collection range above">coll</button>
      <button type="button" data-scope="exclude" title="Drop the collection range above instead of restricting to it -- works with or without &quot;coll&quot;">excl</button>
    </div>

    <div class="scope-row">
      <div>
        <label for="od-filter" title="Comma-separated object classes required in the frame, e.g. &quot;car, dog&quot; — fuzzy-matched against the OD vocabulary, applied as an AND filter after ranking.">Object filter</label>
        <input type="text" id="od-filter" placeholder="e.g. car, dog, red car">
      </div>
    </div>

    <div class="scope-row">
      <div>
        <label for="facet-field" title="Filter to videos tagged with one value of a structured field extracted from that lot's metadata (backend/metadata_filter.py) — e.g. only Toán exam-prep videos, or only Cà Mau travel episodes.">Metadata filter</label>
        <select id="facet-field">
          <option value="">(none)</option>
        </select>
        <select id="facet-value" disabled>
          <option value="">— pick a field first —</option>
        </select>
      </div>
    </div>

    <div class="scope-row">
      <div>
        <label for="top-k">Top-K</label>
        <input type="number" id="top-k" value="100" min="1" max="200" step="5">
      </div>
      <div id="top-v-wrap" style="display:none;">
        <label for="top-v">Top-V</label>
        <input type="number" id="top-v" value="10" min="1" max="50" step="1">
      </div>
      <div id="top-g-wrap" style="display:none;">
        <label for="top-g" title="Frames kept per video after per-video drill-down.">Top-G</label>
        <input type="number" id="top-g" value="5" min="1" max="50" step="1">
      </div>
    </div>

    <!-- "Group by video" and "Show full text" used to live here; they're
         saved settings now, in the ⚙ dialog above (frontend/js/settings.js). -->

    <hr class="divider">

    <div id="signal-controls"><!-- populated per-signal by signals/*.js --></div>
  </aside>

  <main class="main">
    <h1>Routing101 by MiLF</h1>
    <div id="status-banner"></div>
    <div id="results"></div>
  </main>

</div>

<div id="dialog-root"></div>

<script type="module" src="/app/js/app.js"></script>
</body>
</html>
